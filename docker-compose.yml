services:
  qq-bot-service:
    image: ghcr.io/cychenhaibin/qq-bot:release
    container_name: qq-bot-service
    restart: unless-stopped
    environment:
      QQ_BOT_APP_ID: ${QQ_BOT_APP_ID:?QQ_BOT_APP_ID is required}
      QQ_BOT_APP_SECRET: ${QQ_BOT_APP_SECRET:?QQ_BOT_APP_SECRET is required}
      QQ_BOT_API_BASE_URL: ${QQ_BOT_API_BASE_URL:-https://api.bot.qq.com}
      QQ_BOT_TOKEN_ENDPOINT: ${QQ_BOT_TOKEN_ENDPOINT:-https://bots.qq.com/app/getAppAccessToken}
      QQ_BOT_GATEWAY_URL: ${QQ_BOT_GATEWAY_URL:-}
      FLUXA_NEW_API_BASE_URL: ${FLUXA_NEW_API_BASE_URL:?FLUXA_NEW_API_BASE_URL is required}
      FLUXA_NEW_API_BOT_ID: ${FLUXA_NEW_API_BOT_ID:?FLUXA_NEW_API_BOT_ID is required}
      FLUXA_NEW_API_SERVICE_SECRET: ${FLUXA_NEW_API_SERVICE_SECRET:?FLUXA_NEW_API_SERVICE_SECRET is required}
      FLUXA_RECHARGE_URL: ${FLUXA_RECHARGE_URL:-https://catfk.com/shop/FluxA}
      CHARITY_NEW_API_BASE_URL: ${CHARITY_NEW_API_BASE_URL:?CHARITY_NEW_API_BASE_URL is required}
      CHARITY_NEW_API_BOT_ID: ${CHARITY_NEW_API_BOT_ID:?CHARITY_NEW_API_BOT_ID is required}
      CHARITY_NEW_API_SERVICE_SECRET: ${CHARITY_NEW_API_SERVICE_SECRET:?CHARITY_NEW_API_SERVICE_SECRET is required}
      CHARITY_RECHARGE_URL: ${CHARITY_RECHARGE_URL:-}
